# Comparison config — realesr-general-x4v3 at 256×256 fixed shape.
# Same pinned pipeline, thresholds and test tile as RealESRGAN_x4plus, so the Level A numbers
# are like-for-like; only the weights and the architecture differ. Certification spec §7.2
# reserves this lever: "a miss means switch models, not degrade output."
model_id: realesr-general-x4v3
scale_factor: 4

architecture:
  type: SRVGGNetCompact       # tools/convert/model_loader.py
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_conv: 32
  upscale: 4
  act_type: prelu

source:
  repo: https://github.com/xinntao/Real-ESRGAN
  commit_or_release: v0.2.5.0
  license: BSD-3-Clause

weights:
  url: https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
  sha256: 8dc7edb9ac80ccdc30c3a5dca6616509367f05fbc184ad95b731f05bece96292
  # Shared with the bare-id directory, exactly as x4plus_512 shares x4plus's weights.
  path: models/realesr-general-x4v3/weights/realesr-general-x4v3.pth
  state_dict_key: params      # NOT x4plus's 'params_ema' — this checkpoint has no EMA copy

conversion:
  representation: mlprogram
  precision: float16
  input_shape: [1, 3, 256, 256]
  min_deployment: macOS14
  compute_units: ALL
  seed: 0

preprocessing: "RGB float [0,1], NCHW"
postprocessing: "clamp [0,1]"

# Level A comparison tile: a deterministic synthetic image at this config's input shape,
# generated by `python tools/fixtures/make_fixtures.py` (gitignored, never committed).
test_tile: models/realesr-general-x4v3/conversion/input_tile.png

thresholds:
  psnr_db: 38.0               # certification spec §4, Level A — unchanged
