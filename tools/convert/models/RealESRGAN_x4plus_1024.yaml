# Large-shape conversion config — 1024×1024 fixed-shape variant of RealESRGAN_x4plus.
# Identical weights, architecture, pipeline and thresholds to the 256×256 baseline
# (RealESRGAN_x4plus.yaml); only the fixed input shape and the test tile differ.
# The variant carries its own model id because the manifest schema is strictly
# single-shape per model directory (tools/convert/manifest.py).
model_id: RealESRGAN_x4plus_1024
scale_factor: 4

architecture:
  type: RRDBNet
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_block: 23
  num_grow_ch: 32

source:
  repo: https://github.com/xinntao/Real-ESRGAN
  commit_or_release: v0.1.0
  license: BSD-3-Clause

weights:
  url: https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
  # Same pinned artifact as the 256×256 baseline (verified again at conversion time).
  sha256: 4fa0d38905f75ac06eb49a7951b426670021be3018265fd191d2125df9d682f1
  path: models/RealESRGAN_x4plus/weights/RealESRGAN_x4plus.pth
  state_dict_key: params_ema

conversion:
  representation: mlprogram
  precision: float16
  input_shape: [1, 3, 1024, 1024]
  min_deployment: macOS14
  compute_units: ALL          # overridable via --compute-units; recorded either way
  seed: 0

preprocessing: "RGB float [0,1], NCHW"
postprocessing: "clamp [0,1]"

# Level A comparison tile: a deterministic synthetic image at this config's input shape,
# generated by `python tools/fixtures/make_fixtures.py` (gitignored, never committed).
test_tile: models/RealESRGAN_x4plus_1024/conversion/input_tile.png

thresholds:
  psnr_db: 38.0               # certification spec §4, Level A
