# x2plus conversion config — the exact parameters that define this artifact.
# Everything a reader needs to answer "why did model X produce this output" six months
# from now lives here and in the generated manifest.json (certification spec §11).
model_id: RealESRGAN_x2plus_512
scale_factor: 2

architecture:
  type: RRDBNet
  scale: 2                     # pixel_unshuffle by 2 at the input; conv_first is 12->64
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_block: 23
  num_grow_ch: 32

source:
  repo: https://github.com/xinntao/Real-ESRGAN
  commit_or_release: v0.2.1
  license: BSD-3-Clause

weights:
  url: https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.1/RealESRGAN_x2plus.pth
  # convert.py verifies the local file against this and refuses to proceed on mismatch;
  # fetching is tools/artifacts/fetch.py's job, not this pipeline's.
  sha256: 49fafd45f8fd7aa8d31ab2a22d14d91b536c34494a5cfe31eb5d89c2fa266abb
  path: models/RealESRGAN_x2plus_512/weights/RealESRGAN_x2plus.pth
  state_dict_key: params_ema

conversion:
  representation: mlprogram
  precision: float16
  input_shape: [1, 3, 512, 512]
  min_deployment: macOS14
  compute_units: ALL          # overridable via --compute-units; recorded either way
  seed: 0

preprocessing: "RGB float [0,1], NCHW"
postprocessing: "clamp [0,1]"

# Level A comparison tile: a deterministic synthetic image at this config's input shape,
# generated by `python tools/fixtures/make_fixtures.py` (gitignored, never committed).
test_tile: models/RealESRGAN_x2plus_512/conversion/input_tile.png

thresholds:
  psnr_db: 38.0               # certification spec §4, Level A
